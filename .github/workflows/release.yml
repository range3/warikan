name: Release APK

# v1.2.3 形式のタグを push すると、テスト → 署名付き APK のビルド → GitHub Release の作成 を行う
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got $tag)"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( minor > 99 || patch > 99 )); then
            echo "::error::minor and patch must be 0-99"
            exit 1
          fi
          echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      # gradle/gradle-daemon-jvm.properties が Java 25 を要求するので合わせる
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="warikan-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "warikan ${GITHUB_REF_NAME}" \
            --generate-notes
